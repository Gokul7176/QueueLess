# ==============================================================================
# QueueLess Application Configuration
# College DevOps Laboratory Project — 23IT723
# ==============================================================================

# Server Configuration (Runs on 8085 to avoid collision with Jenkins on 8080)
server.port=${SERVER_PORT:8085}
server.servlet.context-path=/

# Application Name
spring.application.name=queueless

# Database Configuration (H2 In-Memory Database)
spring.datasource.url=jdbc:h2:mem:queuelessdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console Settings (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Logging Configuration
logging.level.root=INFO
logging.level.com.queueless=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
