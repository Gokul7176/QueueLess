# ==============================================================================
# QueueLess — Ansible Inventory File
# College DevOps Laboratory Project — 23IT723 (Experiment 10)
# ==============================================================================

[local]
# Local deployment target (e.g. Ubuntu on WSL2 or local Linux host)
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[webservers]
# Managed node target (update IP / hostname for college lab network)
# 192.168.1.100 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[all:vars]
ansible_python_interpreter=/usr/bin/python3
app_name=queueless
app_version=1.1.0
app_port=8085
container_name=queueless-app
image_name=queueless:1.1.0-8b8297d
deploy_dir=/opt/queueless
